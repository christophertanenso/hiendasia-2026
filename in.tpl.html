<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<title>HiEnd Asia 2026 · Door</title>
<!-- Built by build.py from in.tpl.html. Opened by a phone camera scanning the QR code on a ticket (in.html?t=HEA26-…).
     Without the door PIN the page only shows the visitor their ticket number. A staff phone enters the PIN once; it is
     kept on that phone, and every scan after that checks the ticket in (apps-script/Code.gs, checkIn_). -->
<style>
  :root { --bg: #000; --fg: #ebebeb; --dim: #a8a8a8; --gold: #c6a661; --line: #333; }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body { margin: 0; min-height: 100vh; background: var(--bg); color: var(--fg); font: 17px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif; transition: background .2s; }
  body[data-state="admitted"] { --bg: #0b5d2a; --dim: #cfe8d6; }
  body[data-state="repeat"] { --bg: #7a5600; --dim: #f2e2bd; }
  body[data-state="error"] { --bg: #7d1414; --dim: #f2caca; }
  main { max-width: 480px; margin: 0 auto; padding: max(28px, env(safe-area-inset-top)) 20px 40px; }
  .brand { margin: 0 0 28px; color: var(--gold); font-size: 13px; letter-spacing: .14em; text-transform: uppercase; }
  body[data-state="admitted"] .brand, body[data-state="repeat"] .brand, body[data-state="error"] .brand { color: var(--fg); opacity: .8; }
  h1 { margin: 0 0 6px; font-size: clamp(34px, 11vw, 52px); line-height: 1.05; letter-spacing: .01em; }
  .name { margin: 0; font-size: 26px; font-weight: 700; overflow-wrap: anywhere; }
  .detail { margin: 4px 0 0; color: var(--dim); font-size: 18px; }
  .ticket { margin: 18px 0 0; font: 600 20px/1.3 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; letter-spacing: .06em; overflow-wrap: anywhere; }
  .msg { margin: 18px 0 0; color: var(--dim); }
  form { margin: 28px 0 0; }
  label { display: block; margin: 0 0 8px; font-weight: 700; }
  input { width: 100%; padding: 14px 16px; font: 600 24px/1.2 ui-monospace, Menlo, Consolas, monospace; letter-spacing: .2em; color: #000; background: #fff; border: 0; border-radius: 10px; }
  button { font: inherit; cursor: pointer; }
  .go { display: block; width: 100%; margin: 14px 0 0; padding: 15px 20px; font-weight: 700; color: #000; background: var(--gold); border: 0; border-radius: 50px; }
  .link { display: inline-block; margin: 32px 0 0; padding: 10px 0; color: var(--fg); background: none; border: 0; text-decoration: underline; text-underline-offset: 3px; opacity: .85; }
  [hidden] { display: none !important; }
</style>
</head>
<body data-state="busy">
<main>
  <p class="brand">HiEnd Asia 2026 · Entrance</p>
  <h1 id="dHead">Checking…</h1>
  <p class="name" id="dName" hidden></p>
  <p class="detail" id="dDetail" hidden></p>
  <p class="ticket" id="dTicket" hidden></p>
  <p class="msg" id="dMsg" role="status" hidden></p>
  <form id="pinForm" autocomplete="off" hidden>
    <label for="pin">Door PIN</label>
    <input id="pin" name="pin" type="password" inputmode="numeric" autocomplete="off" maxlength="12" required>
    <button class="go" id="pinGo" type="submit">Start checking in</button>
  </form>
  <button class="go" id="retry" type="button" hidden>Try again</button>
  <button class="link" id="staffBtn" type="button" hidden>Door staff: check this ticket in</button>
  <button class="link" id="signOut" type="button" hidden>Turn off door mode on this phone</button>
</main>
<script>
(function () {
  var ENDPOINT = '{{ENDPOINT}}';
  var KEY = 'hea-door-pin';
  var $ = function (id) { return document.getElementById(id); };
  function getPin() { try { return localStorage.getItem(KEY); } catch (e) { return null; } }
  function setPin(v) { try { if (v) localStorage.setItem(KEY, v); else localStorage.removeItem(KEY); } catch (e) {} }
  var ticket = '';
  try { ticket = (new URLSearchParams(location.search).get('t') || '').replace(/\s+/g, '').toUpperCase(); } catch (e) {}
  if (!/^[A-Z0-9-]{6,20}$/.test(ticket)) ticket = '';

  function text(id, v) { var el = $(id); el.textContent = v || ''; el.hidden = !v; }
  function show(state, o) {
    o = o || {};
    document.body.setAttribute('data-state', state);
    text('dHead', o.head); text('dName', o.name); text('dDetail', o.detail); text('dTicket', o.ticket); text('dMsg', o.msg);
    $('pinForm').hidden = state !== 'pin';
    $('staffBtn').hidden = state !== 'visitor';
    $('retry').hidden = !o.retry;
    $('signOut').hidden = !getPin() || state === 'visitor' || state === 'pin';
    if (state === 'pin') { $('pin').value = ''; $('pin').focus(); }
  }
  function visitor() {
    show('visitor', { head: 'Your ticket', ticket: ticket,
      msg: 'Show this QR code at the entrance. Our staff will scan it to let you in. Free entry, 17 to 19 December 2026, Suntec Singapore.' });
  }

  function checkIn() {
    var pin = getPin();
    show('busy', { head: 'Checking…', ticket: ticket });
    var ctl = window.AbortController ? new AbortController() : null;
    if (ctl) setTimeout(function () { ctl.abort(); }, 20000);
    // text/plain keeps this a simple request: Apps Script web apps cannot answer a CORS preflight.
    fetch(ENDPOINT, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, redirect: 'follow',
      body: JSON.stringify({ action: 'checkin', ticket: ticket, pin: pin }), signal: ctl ? ctl.signal : undefined })
      .then(function (r) { return r.json(); })
      .then(function (res) {
        if (res && res.ok) {
          var detail = (res.interest || 'Visitor') + ' · visit ' + res.visits;
          if (res.repeat) return show('repeat', { head: 'Already scanned', name: res.name, detail: detail, ticket: res.ticket,
            msg: 'This ticket was checked in less than 2 minutes ago, so it was not counted again.' });
          return show('admitted', { head: 'Admitted', name: res.name, detail: detail, ticket: res.ticket,
            msg: 'Scan the next ticket with the camera.' });
        }
        var code = res && res.error;
        if (code === 'pin') { setPin(null); return show('pin', { head: 'Door staff', ticket: ticket, msg: 'Wrong PIN. Try again.' }); }
        if (code === 'ticket') return show('error', { head: 'Not found', ticket: ticket,
          msg: 'This ticket is not registered. Ask for their name and email, or ask them to register on the spot.' });
        if (code === 'locked') return show('error', { head: 'Paused', ticket: ticket, retry: true,
          msg: 'Too many wrong PINs were tried. Wait 15 minutes, then try again.' });
        if (code === 'closed') return show('error', { head: 'Not switched on', ticket: ticket,
          msg: 'Door check-in has no PIN set yet. Ask the organiser.' });
        show('error', { head: 'Try again', ticket: ticket, retry: true, msg: 'Something went wrong on our side. Try again.' });
      })
      .catch(function () {
        show('error', { head: 'No connection', ticket: ticket, retry: true,
          msg: 'The check-in could not reach the server. Check the phone’s connection and try again.' });
      });
  }

  $('staffBtn').addEventListener('click', function () { show('pin', { head: 'Door staff', ticket: ticket }); });
  $('pinForm').addEventListener('submit', function (ev) {
    ev.preventDefault();
    var v = $('pin').value.replace(/\s+/g, '');
    if (!v) return;
    setPin(v); checkIn();
  });
  $('retry').addEventListener('click', checkIn);
  $('signOut').addEventListener('click', function () { setPin(null); if (ticket) visitor(); else show('error', { head: 'No ticket', msg: 'Door mode is off on this phone.' }); });

  if (!ticket) return show('error', { head: 'No ticket', msg: 'This link has no ticket number in it. Scan the QR code on the ticket again.' });
  if (!ENDPOINT) return show('error', { head: 'Not open yet', ticket: ticket, msg: 'Check-in is not connected yet.' });
  if (getPin()) checkIn(); else visitor();
})();
</script>
</body>
</html>
