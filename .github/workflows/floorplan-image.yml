# Runs on push to the update branch (when the source plan, script or this file changes), or by hand once on main.
# Needs the repository secret OPENROUTER_API_KEY. Commits img/floorplan-2026.* back to that branch.
name: Restyle floor plan
on:
  push:
    branches: [show-2026-update]
    paths: [tools/clean_floorplan.py, Layout/floorplan-2026-source.png, .github/workflows/floorplan-image.yml]
  workflow_dispatch:
    inputs:
      model:
        description: OpenRouter image model
        default: google/gemini-2.5-flash-image
permissions:
  contents: write
jobs:
  restyle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pillow
      - run: python tools/clean_floorplan.py --model "${{ inputs.model || 'google/gemini-2.5-flash-image' }}"
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898699+github-actions[bot]@users.noreply.github.com"
          git add img/floorplan-2026.png img/floorplan-2026.webp
          git commit -m "Restyle 2026 floor plan via OpenRouter" || echo "No change"
          git push
