# Runs the registration tests on every pull request and on every push to main (the branch GitHub Pages publishes).
name: Tests
on:
  pull_request:
  push:
    branches: [main]
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      # The browser tests measure layout in every language, so the runner needs CJK and Thai fonts.
      - name: Install fonts
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends fonts-noto-cjk fonts-thai-tlwg
      - name: Run tests
        run: npm test
